site:
  title: "bmf-tech"
  description: "bmf-san's personal tech blog"
  base_url: "https://bmf-tech.com"
  language: "en"
  github_repo: "https://github.com/bmf-san/bmf-tech"
  github_branch: "main"

build:
  content_dir: "content"
  output_dir: "public"
  assets_dir: "assets"
  static_dir: "static"
  parallelism: 4
  per_page: 20
  exclude_files: []

theme:
  name: "default"
  dir: "themes/default"
  params:
    author: "Kenta Takeuchi"
    github: "bmf-san"
    twitter: "bmf_san"
    linkedin: "bmf-san"
    zenn: "bmf_san"
    speaker_deck: "bmf_san"
    footer_text: "© 2026 Kenta Takeuchi"
    description_ja: "bmf-sanの個人技術ブログです。Go・ソフトウェアアーキテクチャを中心に発信しています。"
    adsense_id: "ca-pub-5146230866088201"
    adsense_slot_article_top: "3773998823"
    adsense_slot_article_bottom: "2224967643"
    adsense_slot_list_mobile: "4950844549"
    ga_id: "G-784B55NW88"
    paypal: "bmfsan"
    amazon_wishlist: "7UKXW63I8NEK"
    # Sponsor inquiry form (Google Form). Use prefill URL so the
    # "category" field is pre-selected to 広告掲載のご相談.
    # See: https://docs.google.com/forms/d/e/<form_id>/viewform?usp=pp_url&entry.<id>=<value>
    sponsor_inquiry_url: "https://docs.google.com/forms/d/e/1FAIpQLSeYThU8Mq7GXa-bLzr2i71AhaKVhT_-gLfeQFYZ04tFZ3OO3A/viewform"
    # Sidebar sponsor slots (rendered by the "sponsors-sidebar" template).
    # Order matters: the first entry appears at the top of the slot. The
    # inquiry CTA card is always appended at the bottom by the template.
    # Each entry must define ja/en variants for image/url/name/description/cta/alt.
    sponsors:
      - id: "asset-trend-simulator"
        image:
          ja: "/assets/sponsors/asset-trend-simulator-ja.png"
          en: "/assets/sponsors/asset-trend-simulator-en.png"
        url:
          ja: "https://apps.apple.com/jp/app/id6759601487"
          en: "https://apps.apple.com/us/app/id6759601487"
        name:
          ja: "資産推移シミュレーター"
          en: "Asset Trend Simulator"
        description:
          ja: "長期キャッシュフロー＆ネットワース推移を可視化する iOS アプリ。FIRE・住宅ローン・老後資金の検討に。"
          en: "iOS app for long-term cash-flow & net-worth simulation. Built for FIRE, mortgage, and retirement planning."
        cta:
          ja: "App Store で見る →"
          en: "View on the App Store →"
        alt:
          ja: "資産推移シミュレーター — 将来の純資産を月次で予測する iOS アプリ"
          en: "Asset Trend Simulator — iOS app for long-term net-worth simulation"

syntax_highlight:
  theme: "github"
  line_numbers: false

ogp:
  enabled: true
  background_color: "#ffffff"
  text_color: "#111111"
  logo_file: ""
  width: 1200
  height: 630

i18n:
  default_locale: "en"
  locales:
    - "en"
    - "ja"

plugins:
  amazon_books:
    enabled: true
    tag: "bmf035-22"
  bookshelf:
    enabled: true
    tag: "bmf035-22"
