name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install gohan
        run: make install-gohan

      - name: Build site
        run: make build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NOTE: --commit-message / --commit-hash を明示するのは、
          # Cloudflare Pages API が一部の UTF-8 文字を含むコミットメッセージを
          # `Invalid commit message [code: 8000111]` で弾くケースがあるため。
          # wrangler が git から自動取得した値をそのまま投げるのを避け、ASCII で固定する。
          command: pages deploy public --project-name=bmf-tech --branch=main --commit-hash=${{ github.sha }} --commit-message="Deploy ${{ github.sha }}"
