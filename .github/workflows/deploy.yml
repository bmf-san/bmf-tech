name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  # Daily rebuild at 00:00 UTC so posts whose `date` falls after the most
  # recent push become published once their date is reached. gohan v1.3.0
  # excludes future-dated posts from the build by default, so without a
  # scheduled run, scheduled posts would only appear on the next push.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install gohan
        run: make install-gohan

      - name: Build site (with phase timings and rebuild explanation)
        run: GOTOOLCHAIN=auto gohan build --stats --explain

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # NOTE: --commit-message / --commit-hash を明示するのは、
          # Cloudflare Pages API が一部の UTF-8 文字を含むコミットメッセージを
          # `Invalid commit message [code: 8000111]` で弾くケースがあるため。
          # wrangler が git から自動取得した値をそのまま投げるのを避け、ASCII で固定する。
          command: pages deploy public --project-name=bmf-tech --branch=main --commit-hash=${{ github.sha }} --commit-message="Deploy ${{ github.sha }}"
