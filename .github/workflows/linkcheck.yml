name: Broken Link Check

on:
  pull_request:
    branches: [main]
  schedule:
    # weekly Monday 00:00 UTC; catches link rot on already-merged content
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  linkcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Install gohan
        run: make install-gohan

      - name: Build site
        run: make build

      - name: Run lychee on built site
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}/public
            --accept 200,202,206,301,302,304,400,401,402,403,415,429,500,502,503,504,520,521,522,523,524,999
            --timeout 30
            --max-retries 3
            --exclude '^https?://bmf-tech\.com'
            --exclude '^https?://github\.com/bmf-san/bmf-tech/blob/'
            --exclude '^https?://(www\.)?linkedin\.com'
            --exclude '^https?://web\.archive\.org/'
            --exclude '^https?://region-name-project-id\.cloudfunctions\.net/'
            --exclude '^https?://www\.cs\.cmu\.edu/'
            --exclude '^https?://wa3\.i-3-i\.info/'
            --exclude '^https?://selfnote\.work/'
            --exclude '^https?://(www|docs)\.styra\.com/'
            --exclude '^https?://selinuxproject\.org/'
            --exclude '^https?://alexromanov\.github\.io/'
            --exclude '^https?://dius\.com\.au/'
            --exclude '^https?://wiki\.infra-workshop\.tech/'
            --exclude '^https?://www\.apollographql\.com/docs'
            --exclude '^https?://fi\.ort\.edu\.uy/'
            --exclude '^https?://www\.ncad\.co\.jp/'
            --exclude '^https?://www\.sakimura\.org/'
            'public/**/*.html'
          # Don't block PRs on link errors. The repo currently has many
          # pre-existing broken links (mostly cross-locale tag links and
          # third-party TLS issues) that exist on main; failing PR CI on
          # them prevents Dependabot updates from merging. The scheduled
          # weekly run still surfaces regressions.
          fail: ${{ github.event_name == 'schedule' }}
