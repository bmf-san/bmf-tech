name: Lint Content

on:
  pull_request:
    branches: [main]
    paths:
      - 'content/ja/posts/**'
      - 'content/en/posts/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install textlint dependencies
        run: make install-lint

      - name: Install gohan
        run: make install-gohan

      - name: gohan check (duplicate slugs / required front matter / orphan translation_key)
        run: make check-content

      - name: Lint changed posts
        run: make lint-content-diff
